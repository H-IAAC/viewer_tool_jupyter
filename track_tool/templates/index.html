<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Projects</title>
    <!-- Link to Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .project-list {
            list-style-type: none;
            padding: 0;
        }
        .project-item {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
        }
        .project-link {
            color: #1ed760;
            text-decoration: none;
            font-size: 18px;
            margin-right: 10px;
        }
        .project-link:hover {
            color: #1aa34a;
        }
        .new-project-icon, .delete-icon {
            font-size: 24px;
            cursor: pointer;
            color: #1ed760;
        }
        .new-project-icon:hover, .delete-icon:hover {
            color: #1aa34a;
        }
    </style>
</head>
<body>
    <h1>Created Projects</h1>
    <ul class="project-list">
        {% for project in projects %}
            <li class="project-item">
                <!-- Link to project page -->
                <a href="{{ url_for('track', project_name=project) }}" class="project-link">{{ project }}</a>
                <!-- Delete project icon -->
                <i class="fas fa-trash delete-icon" onclick="deleteProject('{{ project }}')"></i>
            </li>
        {% endfor %}
    </ul>
    <br>
    <!-- Create new project icon -->
    <a href="{{ url_for('new_project') }}" title="Create New Project"><i class="fas fa-plus-circle new-project-icon"></i></a>

    <script>
        // Function to confirm project deletion
        function deleteProject(project) {
            if (confirm(`Are you sure you want to delete the project "${project}"?`)) {
                fetch(`/delete_project/${project}`, {
                    method: 'POST'
                }).then(response => {
                    if (response.ok) {
                        alert("Project deleted successfully!");
                        window.location.reload();
                    } else {
                        alert("Error deleting the project.");
                    }
                }).catch(error => {
                    alert("An error occurred: " + error);
                });
            }
        }
    </script>
</body>
</html>
