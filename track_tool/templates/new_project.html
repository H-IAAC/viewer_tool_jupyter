<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Novo Projeto</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #BB86FC;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        label, input, button, a {
            font-size: 1em;
            margin: 5px 0;
        }
        input[type="text"], input[type="file"] {
            padding: 10px;
            width: 100%;
            max-width: 300px;
            border-radius: 5px;
            border: none;
            background-color: #333;
            color: #ffffff;
        }
        button {
            padding: 10px 20px;
            margin-top: 15px;
            background-color: #6200EE;
            border: none;
            border-radius: 5px;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #1ed760;
        }
        a {
            color: #BB86FC;
            text-decoration: none;
            margin-top: 15px;
        }
        a:hover {
            color: #1ed760;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin-top: 10px;
        }
        .message {
            color: #FF5722; /* Cor para mensagens de erro/feedback */
        }
    </style>
</head>
<body>
    <h1>Criar Novo Projeto</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>
          {% for category, message in messages %}
            <li class="{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    
    <form action="{{ url_for('new_project') }}" method="post" enctype="multipart/form-data">
        <label for="project_name">Nome do Projeto:</label>
        <input type="text" id="project_name" name="project_name" required>
        
        <label for="video_file">Upload do Vídeo:</label>
        <input type="file" id="video_file" name="video_file" accept="video/*" required>
        
        <button type="submit">Criar Projeto</button>
    </form>
    
    <a href="{{ url_for('index') }}">Voltar</a>
</body>
</html>
